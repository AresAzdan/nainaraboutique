<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAINARA - Admin Login</title>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js"></script>
    <style>
        :root {
            --primary: #463e31;
            --primary-dark: #2d2820;
            --bg-body: #f3f4f6;
            --border-color: #e5e7eb;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f0eb 0%, #e8e0d5 50%, #d4c9bb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(70,62,49,0.15);
            border: 1px solid rgba(70,62,49,0.1);
        }

        .brand {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 28px;
            color: white;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .brand-sub {
            font-size: 13px;
            color: #9ca3af;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper > i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 18px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 10px 40px 10px 40px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
            background: #fafafa;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(70,62,49,0.08);
        }

        .toggle-pw {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #9ca3af;
            font-size: 18px;
            display: flex;
            align-items: center;
            z-index: 2;
            padding: 4px;
        }
        .toggle-pw:hover { color: var(--primary); }

        .error-banner {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #991b1b;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .error-banner.show { display: flex; }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-login:hover { background: var(--primary-dark); }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        .spinner.show { display: block; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand">
                <div class="brand-icon">
                    <i class="ph ph-hexagon"></i>
                </div>
                <div class="brand-name">NAINARA</div>
                <div class="brand-sub">Admin Dashboard — Sign in to continue</div>
            </div>

            <div id="error-banner" class="error-banner">
                <i class="ph ph-warning-circle"></i>
                <span id="error-msg">Invalid username or password.</span>
            </div>

            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="ph ph-user"></i>
                        <input type="text" id="username" class="form-input" placeholder="admin" autocomplete="username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="ph ph-lock"></i>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="toggle-pw" onclick="togglePassword()">
                            <i id="pw-icon" class="ph ph-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="btn-login">
                    <div class="spinner" id="spinner"></div>
                    <span id="btn-text">Sign In</span>
                </button>
            </form>

            <div class="login-footer">
                NAINARA Muslim Boutique &copy; 2026
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://nainaraboutique.com';

        // Redirect if already logged in
        if (sessionStorage.getItem('nainara_token')) {
            window.location.href = 'nainara_admin.html';
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('pw-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'ph ph-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'ph ph-eye';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btn-text');
            const errorBanner = document.getElementById('error-banner');
            const errorMsg = document.getElementById('error-msg');

            // Reset error
            errorBanner.classList.remove('show');

            // Loading state
            btn.disabled = true;
            spinner.classList.add('show');
            btnText.textContent = 'Signing in...';

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: username, password })
                });

                const data = await res.json();

                if (res.ok && data.token) {
                    sessionStorage.setItem('nainara_token', data.token);
                    sessionStorage.setItem('nainara_user', JSON.stringify({
                        username: data.username || username,
                        role: data.role || 'Admin'
                    }));
                    window.location.href = 'nainara_admin.html';
                } else {
                    throw new Error(data.message || 'Invalid credentials');
                }
            } catch (err) {
                errorMsg.textContent = err.message === 'Failed to fetch'
                    ? 'Cannot connect to server. Please check your connection.'
                    : err.message;
                errorBanner.classList.add('show');
            } finally {
                btn.disabled = false;
                spinner.classList.remove('show');
                btnText.textContent = 'Sign In';
            }
        }
    </script>
</body>
</html>
